<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<title>DSECT — Forms</title>
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../components.css">
<style>
  body { padding: 24px 24px 60px; max-width: 420px; }
  .field { margin-bottom: 20px; }
  .field label { display: block; font-size: 12px; color: var(--fg-3); margin-bottom: 6px; }
  .row { display: flex; align-items: center; gap: 10px; }
</style>
</head>
<body>
<button id="themeToggle" style="position:fixed;top:12px;inset-inline-end:12px;z-index:99;min-height:var(--tap);padding:0 12px;border-radius:var(--radius);border:1px solid var(--border-3);background:var(--surface);color:var(--fg-2);font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;">theme: light</button>

<h1 class="text-section" style="margin-bottom:4px;">Forms</h1>
<p class="text-lede" style="margin-bottom:28px;">Text inputs get a soft custom focus ring (<code>box-shadow: 0 0 0 3px var(--focus-soft)</code>), not the sharp <code>--focus-ring</code> outline reserved for buttons and checkboxes — a hard 2px ring on a 44px field reads as an error, not focus. Font-size is forced to 16px under 760px to block iOS auto-zoom.</p>

<div class="field">
  <label for="f1">Service name</label>
  <input class="input" id="f1" type="text" placeholder="tritium-gateway">
</div>
<div class="field">
  <label for="f2">Environment</label>
  <select id="f2">
    <option>production</option>
    <option>staging</option>
    <option>local</option>
  </select>
</div>
<div class="field">
  <label for="f3">Notes</label>
  <textarea id="f3" rows="3" placeholder="Optional"></textarea>
</div>
<div class="field row check-toggle">
  <input type="checkbox" id="f4" checked>
  <label for="f4" style="margin:0;">Restart automatically on failure</label>
</div>
<div style="margin-bottom:20px;">
  <label class="check-native"><input type="checkbox" class="native"> <span>Native checkbox — accent-color only; the label is the 44px target</span></label>
</div>

<script>
document.getElementById('themeToggle').addEventListener('click', function(){
  var root = document.documentElement;
  var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  root.setAttribute('data-theme', next);
  this.textContent = 'theme: ' + next;
});
</script>
</body>
</html>
