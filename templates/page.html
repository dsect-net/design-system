<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page title — DSECT</title>
<meta name="description" content="One sentence on what this page is for.">
<!-- browser chrome colour: meta tags can't read CSS, so these are --bg's values, copied -->
<meta name="theme-color" content="#0A0C10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<!-- apply a saved theme before first paint, so a light-theme reader never sees a dark flash -->
<script>try { var t = localStorage.getItem('dsect-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<!-- the four stylesheets, in this order; fix the paths when you copy this file -->
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../components.css">
</head>
<body>
  <header class="masthead-wrap">
    <div class="wrap masthead">
      <a class="wordmark" href="./">DSECT<span class="wordmark__cut" aria-hidden="true">//</span><span class="wordmark__descriptor">Product</span></a>
      <!-- no section nav on a single page: .mast-nav hides below 900px, so a page with one
           needs the drawer from templates/dashboard.html as its mobile nav -->
      <button class="icon-btn" id="themeToggle" aria-label="Switch to light theme" style="margin-inline-start:auto;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </div>
  </header>

  <main class="wrap" style="padding-block: var(--space-8) var(--space-16);">
    <span class="text-label">Eyebrow</span>
    <h1 style="margin: var(--space-2) 0;">Page title <em>with a quieter half</em></h1>
    <p class="text-lede" style="max-width: 62ch; margin: 0 0 var(--space-8);">One or two sentences of lede. Replace this with what the page is for.</p>

    <div class="panel">
      <div class="panel-head"><h2 class="text-card-title" style="margin:0;">A panel</h2><span class="state state--ready"><i class="state__dot" aria-hidden="true"></i>Ready</span></div>
      <div class="panel-body"><p class="text-body" style="margin:0;">Content goes here. Every value comes from a token; this page declares none.</p></div>
    </div>

    <hr class="rule rule--cut" style="margin-top: var(--space-12);">
    <footer class="text-small" style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--space-2) var(--space-6);color:var(--fg-5);">
      <span class="wordmark" style="font-size:13px;">DSECT<span class="wordmark__cut" aria-hidden="true">//</span></span>
      <span>Decompose. Then build.</span>
    </footer>
  </main>

<script>
(function(){
  var btn = document.getElementById('themeToggle'), root = document.documentElement;
  function label(){ btn.setAttribute('aria-label', 'Switch to ' + (root.getAttribute('data-theme') === 'light' ? 'dark' : 'light') + ' theme'); }
  label();
  btn.addEventListener('click', function(){
    var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('dsect-theme', next); } catch (e) {}
    label();
  });
})();
</script>
</body>
</html>
