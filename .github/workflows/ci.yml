name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# a new push to the same pull request cancels the run it supersedes
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: design system check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # tokens resolve, no literals, theme parity, WCAG contrast, fonts, links, ADR-012, bridge
      - run: node scripts/check.mjs

  smoke:
    name: rendered smoke test (errors, overflow, 44px targets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke

  react:
    name: react layer builds against the CSS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  kit:
    name: react kit typechecks and builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kit/package-lock.json
      - run: npm ci --no-audit --no-fund
      # kit type-checks react/src via relative imports, so react's own
      # dependencies (@types/react, …) must be installed for module resolution
      - run: npm --prefix ../react install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  publish:
    name: publish the kit image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, smoke, react, kit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish ghcr.io/dsect-net/design-system:main
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -f kit/Dockerfile -t ghcr.io/dsect-net/design-system:main .
          docker push ghcr.io/dsect-net/design-system:main

