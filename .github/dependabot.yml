version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Playwright for the smoke test; CI installs the browser that matches it
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /react
    schedule:
      interval: monthly
    groups:
      react-tooling:
        patterns: ["*"]
